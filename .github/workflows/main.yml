name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip खोलो और प्रोजेक्ट फ़ोल्डर ढूँढो
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z"; done
          S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          [ -n "$S" ] || { echo "प्रोजेक्ट नहीं मिला, zip अपलोड हुई?"; exit 1; }
          echo "APP_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK बनाओ
        working-directory: ${{ env.APP_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bot-manager-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/app-debug.apk
